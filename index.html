
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Management System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Student Management System</h1>
    <p class="subtitle">Manage your student records easily</p>

    <form id="studentForm">
      <input type="text" id="studentName" placeholder="Enter student name" required />

      <select id="studentCourse" required>
        <option value="">Select Course</option>
        <option value="BCA">BCA</option>
        <option value="BSc">BSc</option>
        <option value="BCom">BCom</option>
        <option value="BA">BA</option>
      </select>

      <input type="number" id="studentMarks" placeholder="Enter marks (0-100)" min="0" max="100" required />

      <button type="submit" id="submitButton">Add Student</button>
    </form>

    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search student by name..." />

      <select id="filterCourse">
        <option value="All">All Courses</option>
        <option value="BCA">BCA</option>
        <option value="BSc">BSc</option>
        <option value="BCom">BCom</option>
        <option value="BA">BA</option>
      </select>
    </div>

    <div class="summary">
      <h3>Total Students: <span id="totalCount">0</span></h3>
    </div>

    <div id="studentList" class="student-list"></div>

    <p id="emptyMessage">No student records found.</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
